apiVersion: 1

# Nạp các file JSON trong grafana/dashboards/ (mount vào /etc/grafana/dashboards) vào thư mục "E-Learning".
providers:
  - name: elearning
    orgId: 1
    folder: E-Learning
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
