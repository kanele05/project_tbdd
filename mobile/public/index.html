<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA (PLT-01): Expo's metro web template has no manifest link, so this file replaces it.
         `description`, `theme-color` and the favicon are still injected by `expo export` from app.json. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="E-Learning" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paint the page in the right shade before the JS bundle runs (no white flash in dark mode).
         Colors = `background` of lightPalette / darkPalette in src/theme/palettes.ts; the saved
         choice is the AsyncStorage key `elearning.pref.theme-mode` (localStorage on the web). -->
    <script>
      (function () {
        try {
          var mode = window.localStorage.getItem('elearning.pref.theme-mode');
          var isDark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.backgroundColor = isDark ? '#0E1217' : '#FFFFFF';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (error) {
          /* storage blocked: the app paints its own background once it starts */
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
